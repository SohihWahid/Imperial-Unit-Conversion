<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Black+Ops+One&family=Caesar+Dressing&family=Redaction+50:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="upper-half">
        <h2 id="title">Metric/Imperial Unit Conversion</h2>
        <input id="input-el" type="number" placeholder="0">
        <button id="convert-btn">Convert</button>
    </div>
    <div id="lower-half">
        <div class="convert">
            <h3>Length(Meter/Feet)</h3>
            <p id="length-feet"></p>
        </div>
        <div class="convert">
            <h3>Volume(Liters/Gallons)</h3>
            <p id="liters-gallons"></p>
        </div>
        <div class="convert">
            <h3>Mass(Kilograms/Pounds)</h3>
            <p id="kilograms-pounds"></p>
        </div>

    </div>
    <script src="index.js"></script>
</body>

</html>
